tick_period: 1
# Each group:
#   COLOR:    name color in the GUI. A ChatColor name (RED, AQUA...) or a code (&c). Optional.
#   MATERIAL: GUI icon (Bukkit Material name).
#   effects:  list of particles. Use current Bukkit names (FIREWORK, ENCHANTED_HIT...);
#             old pre-1.20.5 names (FIREWORKS_SPARK, CRIT_MAGIC...) are converted automatically.
#             REDSTONE (= DUST) takes a "redstone" block with color (hex) and size.
groups:
  # ===============================================================
  # PREDATOR (プレデター軌道) - 滑空中のみ
  # ===============================================================
  PREDATOR:
    COLOR: RED
    MATERIAL: NETHERITE_INGOT
    effects:
      - particle: REDSTONE
        count: 20
        offset: 0.2
        speed: 0.05
        when: GLIDING
        redstone:
          color: "#FF0000"
          size: 1
      - particle: FLAME
        count: 5
        offset: 0.2
        speed: 0.01
        when: GLIDING
      - particle: FIREWORK
        count: 5
        offset: 0.2
        speed: 0.01
        when: GLIDING

  # ===============================================================
  # MASTER (マスター軌道) - 滑空中のみ
  # ===============================================================
  MASTER:
    COLOR: LIGHT_PURPLE
    MATERIAL: AMETHYST_SHARD
    effects:
      - particle: REDSTONE
        count: 20
        offset: 0.2
        speed: 0.05
        when: GLIDING
        redstone:
          color: "#9900FF"
          size: 1
      - particle: WITCH
        count: 8
        offset: 0.2
        speed: 0.02
        when: GLIDING
      - particle: FIREWORK
        count: 3
        offset: 0.2
        speed: 0.01
        when: GLIDING

  # ===============================================================
  # DIAMOND (ダイヤモンド軌道) - 滑空中のみ
  # ===============================================================
  DIAMOND:
    COLOR: AQUA
    MATERIAL: DIAMOND
    effects:
      - particle: REDSTONE
        count: 20
        offset: 0.2
        speed: 0.05
        when: GLIDING
        redstone:
          color: "#60C2FF"
          size: 1
      - particle: ENCHANTED_HIT
        count: 10
        offset: 0.2
        speed: 0.1
        when: GLIDING
      - particle: SNOWFLAKE
        count: 5
        offset: 0.2
        speed: 0.01
        when: GLIDING

  TEST:
    COLOR: YELLOW
    MATERIAL: GLOWSTONE_DUST
    effects:
      - particle: REDSTONE
        count: 20
        offset: 0.2
        speed: 0.05
        when: GLIDING
        redstone:
          color: "#9900FF"
          size: 1
